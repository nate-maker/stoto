[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "appwrite>=27.2.0",
    "fastapi>=0.162.7",
    "geocoder>=1.38.1",
    "geopandas>=1.2.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "joblib>=1.6.0",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "six>=1.17.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
